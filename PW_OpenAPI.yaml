                lat:
                  type: number
                  description: The latitude coordinate for the AIGFS model.
                  example: 37.25
                lon:
                  type: number
                  description: The longitude coordinate for the AIGFS model.
                  example: -89.5
            aigefs:
              type: object
              properties:
                x:
                  type: integer
                  format: int32
                  description: The X coordinate for the AIGEFS model.
                  example: 1082
                y:
                  type: integer
                  format: int32
                  description: The Y coordinate for the AIGEFS model.
                  example: 509
                lat:
                  type: number
                  description: The latitude coordinate for the AIGEFS model.
                  example: 37.25
                lon:
                  type: number
                  description: The longitude coordinate for the AIGEFS model.
                  example: -89.5
            hrdps:
              $ref: "#/components/schemas/modelGridPoint"
              description: The grid point used for HRDPS.
